name: Tests

# The real automated gate: runs the backend pytest suite and the frontend
# vitest suite on every PR and push to main. (security.yml only builds the
# frontend; nothing ran the 440 backend tests before this.)

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Native libraries the runtime stack needs: pikepdf(qpdf), weasyprint
      # (pango/cairo/gdk-pixbuf), pyzbar(zbar), pdf2image(poppler), plus the
      # external processing binaries the tests exercise (tesseract, ffmpeg,
      # libreoffice). Mirrors the production Dockerfile.
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr tesseract-ocr-eng tesseract-ocr-vie \
            tesseract-ocr-fra tesseract-ocr-deu tesseract-ocr-spa \
            libzbar0 poppler-utils ffmpeg qpdf \
            libcairo2 libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf-2.0-0 \
            libreoffice-writer-nogui libreoffice-calc-nogui libreoffice-impress-nogui \
            fonts-dejavu fonts-liberation shared-mime-info

      # The SPA-fallback tests assert real static files are served, so they
      # need a built frontend/dist to exist.
      - name: Build frontend (for SPA-fallback tests)
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install Python dependencies
        run: |
          # Deliberately not upgrading pip here: `pip install --upgrade pip`
          # pulls an unverified pip from PyPI on every run. The runner's pinned
          # pip already understands --require-hashes, which is all this needs.
          # Install from the hashed lock with --require-hashes so PR CI exercises
          # the exact integrity-verified path the image build uses — a hash/lock
          # problem fails here on every PR instead of only at release build time.
          pip install --require-hashes -r requirements-dev.lock

      - name: Run backend tests
        run: python -m pytest backend/tests -q

  frontend:
    name: Frontend tests (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run frontend tests
        working-directory: frontend
        run: npm run test

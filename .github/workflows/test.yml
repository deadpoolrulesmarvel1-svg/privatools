name: Tests

# The real automated gate: runs the backend pytest suite and the frontend
# vitest suite on every PR and push to main. (security.yml only builds the
# frontend; nothing ran the 440 backend tests before this.)

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  # Callable so release.yml can gate on it. A tag push does not trigger this
  # workflow on its own, which is how a release once shipped with the backend
  # suite failing: CI caught it and nothing stopped the deploy.
  workflow_call:

permissions:
  contents: read

# onnxruntime-node, which @huggingface/transformers depends on, downloads its
# CUDA binaries from NuGet on every Linux x64 `npm ci` unless told not to. No
# job here has a GPU, and that download timing out failed a release gate.
env:
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  backend:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Native libraries the runtime stack needs: pikepdf(qpdf), weasyprint
      # (pango/cairo/gdk-pixbuf), pyzbar(zbar), pdf2image(poppler), plus the
      # external processing binaries the tests exercise (tesseract, ffmpeg,
      # libreoffice). Mirrors the production Dockerfile.
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr tesseract-ocr-eng tesseract-ocr-vie \
            tesseract-ocr-fra tesseract-ocr-deu tesseract-ocr-spa \
            libzbar0 poppler-utils ffmpeg qpdf \
            libcairo2 libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf-2.0-0 \
            libreoffice-writer-nogui libreoffice-calc-nogui libreoffice-impress-nogui libreoffice-math-nogui \
            fonts-dejavu fonts-liberation shared-mime-info

      # The SPA-fallback tests assert real static files are served, so they
      # need a built frontend/dist to exist.
      - name: Build frontend (for SPA-fallback tests)
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install Python dependencies
        run: |
          # Deliberately not upgrading pip here: `pip install --upgrade pip`
          # pulls an unverified pip from PyPI on every run. The runner's pinned
          # pip already understands --require-hashes, which is all this needs.
          # Install from the hashed lock with --require-hashes so PR CI exercises
          # the exact integrity-verified path the image build uses — a hash/lock
          # problem fails here on every PR instead of only at release build time.
          pip install --require-hashes -r requirements-dev.txt

      - name: Run backend tests
        run: python -m pytest backend/tests -q

      - name: Verify downloadable API starters
        run: |
          python scripts/api/starters/build.py --check
          python scripts/api/starters/test.py
          node --test scripts/api/starters/artifacts.test.mjs

  frontend:
    name: Frontend tests (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          # The review-date check below runs `git show <base>:...` against the
          # branch this PR targets and reads the PR's own commit messages.
          # A depth-1 clone has neither, and that check fails rather than
          # skipping, so it must not run on one.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      # gen-llms writes committed files from src/data/: the llms, sitemap, feed
      # and content JSON files in public/. CI only regenerated them inside
      # `npm run build` and never compared the result with the commit, so a
      # registry edit committed without `npm run gen:llms` passed while the
      # copies this job's tests read were stale. Nothing else has written to
      # frontend/ since the checkout, and no output is dated from the clock,
      # so any change here is real.
      - name: Check generated content is current
        working-directory: frontend
        run: |
          npm run gen:llms
          stale=$(git status --porcelain -- .)
          if [ -n "$stale" ]; then
            echo '::error::Generated content files are out of date. Run "npm run gen:llms" in frontend/ and commit the result.'
            git status --short -- .
            git diff -- .
            exit 1
          fi
      - name: Check frontend and content
        working-directory: frontend
        run: |
          npx tsc --noEmit -p tsconfig.app.json
          npm run lint -- --max-warnings 0
          npm run test:content
          npm run test
      # Only on a pull request: it compares this branch with the branch the PR
      # targets, which is the change being reviewed. A push to main has no such
      # pair, and the release gate calls this workflow on a tag.
      - name: Check tool review dates
        if: github.event_name == 'pull_request'
        working-directory: frontend
        env:
          # Where the check looks for [bulk-review], besides the PR's commits.
          # An environment variable, never interpolated into the run block: a
          # PR title is text its author controls.
          PR_TITLE: ${{ github.event.pull_request.title }}
        # The base branch comes from GITHUB_BASE_REF, which the runner already
        # sets on a pull request.
        run: npm run check:review-dates

  image:
    name: Image builds and serves (docker)
    runs-on: ubuntu-latest
    env:
      # Local tag for the loaded image. Nothing is pushed.
      PROBE_IMAGE: privatools:ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
      # Closes a real blind spot. Until this job existed, release.yml was the
      # ONLY workflow that built the Dockerfile, and it runs solely on a v*
      # tag. So a base-image bump (node 20 -> 26) or a change to the build
      # itself could collect a full set of green PR checks that never once
      # compiled it, and first execute during an actual release — where a
      # failure is a broken release rather than a red PR.
      #
      # Deliberately amd64-only and push-less: the point is "does this still
      # build and serve", not reproducing the signed multi-arch artifact.
      # Emulated arm64 would roughly triple the runtime for very little extra
      # signal, since what breaks on a base-image bump is almost always the
      # build steps rather than the architecture.
      - name: Build the image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          # Into the runner's Docker, so the next step can run it.
          load: true
          tags: ${{ env.PROBE_IMAGE }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # A clean build can still ship a broken image. Without a readable
      # tool-content.json the app refuses to start (#179), and without this job
      # the deploy's /readyz gate would be the first thing to notice. This boots
      # the image from docker-compose.yml with the deploy's own command
      # (read-only root, /tmp tmpfs, both volumes) and checks what it serves.
      # Release gates on this job through workflow_call.
      - name: Boot the image as production does and probe it
        timeout-minutes: 5
        run: python3 scripts/ci/probe-image.py "$PROBE_IMAGE"

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Least privilege at the top level: read-only, so any job added later starts
# with no write scope and must opt in explicitly. The write scopes the release
# actually needs are granted on the one job that needs them.
permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  # The gate. A v* tag does not trigger test.yml by itself, so the release
  # calls it: no green suite, no image, no deploy. Costs about two and a half
  # minutes on top of a build that now takes under two.
  tests:
    name: Tests
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  docker:
    name: Build, push, and sign image
    needs: tests
    # The deploy target is aarch64, so arm64 is the image that matters — and on
    # an x86 runner it was the one being emulated through QEMU, which is where
    # a release spent ~20 minutes. GitHub's ARM runners are free on public
    # repos, so it now builds natively. Keep in step with `platforms` below:
    # an x86 runner here without setup-qemu-action cannot build arm64 at all.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read          # checkout
      id-token: write         # cosign keyless signing (OIDC)
      packages: write         # push the image to GHCR
      security-events: write  # upload the Trivy SARIF report
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=sha,prefix=sha-
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .
          # arm64 only. The VM is the sole consumer and it is aarch64;
          # test.yml covers "does this still build on amd64" separately.
          platforms: linux/arm64
          # Repository *variable*, not a secret: a Clerk publishable key names
          # the instance's Frontend API host and is visible in the bundle of
          # every Clerk site. Set since 2026-09-01, which is what switches
          # accounts from local auth to Clerk; unset means Clerk is off and the
          # SDK is never downloaded.
          build-args: |
            VITE_CLERK_PUBLISHABLE_KEY=${{ vars.CLERK_PUBLISHABLE_KEY }}
            VITE_AUTH_PROVIDER=clerk
            VITE_CLERK_SOCIAL_PROVIDERS=${{ vars.CLERK_SOCIAL_PROVIDERS || 'google,github' }}
            VITE_CLERK_USERNAME_ENABLED=true
            VITE_CLERK_PASSKEYS_ENABLED=true
          push: true
          # Without this every release re-ran apt-get, `npm ci` and
          # `pip install` from nothing. The Dockerfile copies package manifests
          # before sources, so those layers survive a source-only change.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: true
      # Require a successful scan with no fixable HIGH/CRITICAL CVEs in the
      # published image's OS packages or installed libraries before signing.
      # A failed scan leaves the image unsigned and blocks release publication.
      - name: Gate release on image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          # Match the ARM64-only image index, regardless of Trivy's default.
          TRIVY_PLATFORM: linux/arm64
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          scanners: vuln
          format: sarif
          output: trivy-image.sarif
          severity: CRITICAL,HIGH
          # The action otherwise removes the severity filter for SARIF.
          limit-severities-for-sarif: true
          ignore-unfixed: true
          exit-code: '1'
      - name: Preserve image scan report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() && hashFiles('trivy-image.sarif') != '' }}
        with:
          name: trivy-image-sarif
          path: trivy-image.sarif
          if-no-files-found: error
          retention-days: 14
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: ${{ !cancelled() && hashFiles('trivy-image.sarif') != '' }}
        continue-on-error: true
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image
      # cosign-installer v4 installs cosign v3 by default, which signs in the
      # Sigstore bundle format and stores it as an OCI referrer instead of the
      # sha256-<digest>.sig tag. auto-deploy.sh verifies each release on the VM
      # with the cosign installed there, and a verifier older than v2.6.3 finds
      # no bundle-format signature, so the deploy would refuse the release.
      # v2.6.5, the last v2 release, still signs in the .sig format, as the
      # v2.5.2 that cosign-installer v3.9.1 installed did. Remove cosign-release
      # once `cosign version` on the VM reports v3.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.6.5
      - name: Sign published image digest
        run: cosign sign --yes "${IMAGE_NAME}@${{ steps.build.outputs.digest }}"

  # A tag is not a release. GitHub's Releases API is what package trackers,
  # awesome-list tooling and self-hosters actually read, and for 42 tags it
  # returned an empty list — so the project looked, to anything automated, as
  # though it had never shipped. Backfilled by hand once; this makes sure it
  # cannot lapse again.
  #
  # Runs after `docker` on purpose: a release should only exist for a version
  # whose image was built, scanned and signed.
  publish-release:
    name: Publish GitHub Release
    needs: docker
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          # --generate-notes diffs against the previous tag, which needs history.
          fetch-depth: 0
      - name: Create the release if it does not already exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists — nothing to do"
            exit 0
          fi
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            --verify-tag

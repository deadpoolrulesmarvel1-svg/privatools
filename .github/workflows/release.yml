name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Least privilege at the top level: read-only, so any job added later starts
# with no write scope and must opt in explicitly. The write scopes the release
# actually needs are granted on the one job that needs them.
permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  docker:
    name: Build, push, and sign image
    runs-on: ubuntu-latest
    permissions:
      contents: read          # checkout
      id-token: write         # cosign keyless signing (OIDC)
      packages: write         # push the image to GHCR
      security-events: write  # upload the Trivy SARIF report
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        id: meta
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=sha,prefix=sha-
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: build
        with:
          context: .
          platforms: linux/arm64,linux/amd64
          # Repository *variable*, not a secret: a Clerk publishable key names
          # the instance's Frontend API host and is visible in the bundle of
          # every Clerk site. Unset until a production Clerk instance exists,
          # and unset means Clerk is off — the SDK is not downloaded and
          # accounts use local auth, which is the current behaviour.
          build-args: |
            VITE_CLERK_PUBLISHABLE_KEY=${{ vars.CLERK_PUBLISHABLE_KEY }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: true
      # Scan the built image (OS packages + installed libs) for known CVEs.
      # The repo's other Trivy job is scan-type:fs (source tree only) — this is
      # the S2 gap: we were shipping a signed-but-unscanned artifact. Report-only
      # for now (continue-on-error + no failing exit-code): surface findings to
      # the Security tab without blocking releases. Tighten to a hard gate once
      # the base image + native parser CVEs are triaged.
      - name: Scan built image for CVEs (report-only)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        continue-on-error: true
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-image.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
      - uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v3
        continue-on-error: true
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Sign published image digest
        run: cosign sign --yes "${IMAGE_NAME}@${{ steps.build.outputs.digest }}"

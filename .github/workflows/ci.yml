name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Backend, component and image tests live in test.yml, also called by the
# release gate. This job checks the actual application TypeScript project.
# The former unlocked Python 3.11 and uninstalled Playwright jobs swallowed
# failures with continue-on-error and provided no dependable release evidence.
# onnxruntime-node, which @huggingface/transformers depends on, downloads its
# CUDA binaries from NuGet on every Linux x64 `npm ci` unless told not to. No
# job here has a GPU, and that download timing out failed a release gate.
env:
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  frontend-quality:
    name: Frontend quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install, type-check and lint
        working-directory: frontend
        run: |
          npm ci
          npx tsc --noEmit -p tsconfig.app.json
          npm run lint -- --max-warnings 0
          npm run test:content

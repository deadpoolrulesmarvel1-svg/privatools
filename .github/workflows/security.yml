name: Security

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  frontend:
    name: Frontend audit and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=high
      - name: Type-check and build
        working-directory: frontend
        run: |
          npx tsc --noEmit -p tsconfig.app.json
          npm run build
          npm run check:bundle

  python-audit:
    name: Python dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.10"
          cache: pip
      - name: Install pip-audit
        # Installed from a hashed lock, not a bare `pip install pip-audit`.
        # This tool runs in CI with repository context, so a compromised
        # release on PyPI would execute here; --require-hashes makes that a
        # verification failure instead. Bump via requirements-ci.txt.
        run: pip install --require-hashes -r requirements-ci.lock
      - name: Audit root requirements
        # requirements.txt is the ONLY manifest installed in production (the
        # Dockerfile and the systemd venv both install it; the former
        # backend/requirements.txt was an uninstalled mirror and has been
        # removed to prevent root-vs-backend version skew).
        #
        # rembg advisories CVE-2026-40086 / GHSA-55v6-g8pm-pw4c are fixed in
        # 2.0.75+, and 2.0.81 is on PyPI — but EVERY rembg release from 2.0.70
        # onward declares requires_python >=3.11, and this lock targets 3.10.
        # 2.0.69 is therefore the last version installable here, and the fix is
        # gated behind the Python 3.10 -> 3.12 migration rather than available
        # now. Verified against the PyPI metadata for 2.0.70-2.0.81 on
        # 2026-08-21. Drop both ignores in the same change that moves the lock
        # off 3.10; do not drop them before, or the audit breaks with an
        # unsatisfiable resolve rather than a clean pass.
        run: pip-audit -r requirements.txt --ignore-vuln CVE-2026-40086 --ignore-vuln GHSA-55v6-g8pm-pw4c

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: github/codeql-action/init@dd903d2e4f5405488e5ef1422510ee31c8b32357 # v3
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@dd903d2e4f5405488e5ef1422510ee31c8b32357 # v3

  scorecard:
    name: OpenSSF Scorecard
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@62b2cac7ed8198b15735ed49ab1e5cf35480ba46 # v2.4.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v3
        with:
          sarif_file: scorecard.sarif

  trivy:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
      - uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v3
        with:
          sarif_file: trivy-results.sarif

  sbom:
    name: Trivy SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: cyclonedx
          output: trivy-sbom.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trivy-sbom
          path: trivy-sbom.cdx.json

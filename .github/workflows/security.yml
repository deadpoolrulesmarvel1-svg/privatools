name: Security

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  frontend:
    name: Frontend audit and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      # The Node the image builds with (node:26-slim) and the other workflows
      # use, so this job audits and builds the frontend on the same npm.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Audit frontend dependencies
        working-directory: frontend
        # npm audit --audit-level=high, except the advisories audit-exceptions.json
        # lists, each with its reason and an expiry (scripts/audit-check.mjs).
        run: node scripts/audit-check.mjs
      - name: Type-check and build
        working-directory: frontend
        run: |
          npx tsc --noEmit -p tsconfig.app.json
          npm run build
          npm run check:bundle

  python-audit:
    name: Python dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pip-audit
        # Installed from a hashed lock, not a bare `pip install pip-audit`.
        # This tool runs in CI with repository context, so a compromised
        # release on PyPI would execute here; --require-hashes makes that a
        # verification failure instead. Bump via requirements-ci.in.
        run: pip install --require-hashes -r requirements-ci.txt
      - name: Audit the runtime lock
        # requirements.txt is the hashed lock the image installs, every
        # transitive package included, so audit exactly that. --disable-pip
        # reads the pinned, hashed entries as they are instead of letting pip
        # re-resolve the direct pins in requirements.in, which could audit newer
        # transitive versions than the image ships.
        #
        # No --ignore-vuln flags: the two rembg advisories
        # (CVE-2026-40086 / GHSA-55v6-g8pm-pw4c) that previously needed them are
        # fixed in 2.0.81, which became installable when the lock moved to
        # Python 3.12 — every rembg release from 2.0.70 on requires >=3.11.
        # Keep it flagless; a new ignore should be a deliberate, dated decision.
        run: pip-audit -r requirements.txt --disable-pip

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    # Pull requests only: it diffs the PR against its base, so there is nothing
    # for it to compare on a push to main. Catches a bad or newly-vulnerable
    # dependency at review time rather than after it is already merged, which
    # is the gap the other scanners leave — they all run on what is already in.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: always

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2

  scorecard:
    name: OpenSSF Scorecard
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: scorecard.sarif

  trivy:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-results.sarif

  sbom:
    name: Trivy SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: cyclonedx
          output: trivy-sbom.cdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-sbom
          path: trivy-sbom.cdx.json

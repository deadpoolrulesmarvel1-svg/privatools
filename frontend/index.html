    <style>
      #prepaint-brand {
        position: fixed;
        z-index: 95;
        top: 18px;
        left: 16px;
        pointer-events: none;
        font-family: "Bricolage Grotesque", "Manrope", system-ui, sans-serif;
        font-size: 20px;
        line-height: 1;
        font-weight: 700;
        letter-spacing: -0.03em;
        color: #15191B;
      }
      #prepaint-brand em { font-style: normal; color: #0C7E56; }
      /* The prepaint brand exists only to paint something before hydration.
         SkinAppHost sets .app-ready on mount and it retires. */
      .app-ready #prepaint-brand { display: none; }
      #prepaint-shell { background: #FAFAF8; color: #15191B; }
      #prepaint-shell header { border-bottom: 1px solid #E7E5DF; }
      /* Dark, once the pre-paint script has resolved the stored choice… */
      html[data-theme="midnight"] #prepaint-shell { background: #000000; color: #F2F3F5; }
      html[data-theme="midnight"] #prepaint-brand { color: #F2F3F5; }
      html[data-theme="midnight"] #prepaint-brand em { color: #3EE39C; }
      html[data-theme="dark"] #prepaint-brand { color: #E8EAED; }
      html[data-theme="dark"] #prepaint-brand em { color: #38D392; }
      html[data-theme="dark"] #prepaint-shell { background: #0F1113; color: #E8EAED; }
      html[data-theme="dark"] #prepaint-shell header { border-bottom-color: #22262B; }
      /* …and before it has run at all (or with JS off). */
      @media (prefers-color-scheme: dark) {
        html:not([data-theme]) #prepaint-brand { color: #E8EAED; }
        html:not([data-theme]) #prepaint-brand em { color: #38D392; }
        html:not([data-theme]) #prepaint-shell { background: #0F1113; color: #E8EAED; }
        html:not([data-theme]) #prepaint-shell header { border-bottom-color: #22262B; }
      }
      @media (min-width: 640px) {
        #prepaint-brand { left: 24px; }
      }
    </style>

      <script>
      /* Pre-paint theme. Runs before <body> renders so a stored choice never
         flashes the other palette first. Mirrors lib/skinTheme.ts: Daylight
         paints from `data-theme` on <html>; `system` resolves against the OS. */
      (function () {
        try {
          var d = document.documentElement;
          var pref = null;
          try { pref = window.localStorage.getItem('privatools.daylight.theme'); } catch (e) {}
          if (pref === 'system') {
            pref = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          } else if (pref !== 'light' && pref !== 'dark' && pref !== 'midnight') {
            pref = 'light';
          }
          d.setAttribute('data-theme', pref);
        } catch (e) { /* private mode — the CSS media fallback covers it */ }
      })();
    </script>
</head>
  <body>
    <!-- Pre-hydration skip link — points at the AppShell's `<main id="main-content">`.
         AppShell renders its own once React mounts and removes this one by id;
         leaving both would make a keyboard user Tab past the same affordance
         twice. -->
    <a id="prepaint-skip" href="#main-content" class="sr-only focus:not-sr-only focus:fixed focus:top-2 focus:left-2 focus:z-[9999] focus:px-4 focus:py-2 focus:bg-foreground focus:text-background focus:rounded-md focus:text-sm">Skip to main content</a>
    <div id="prepaint-brand" aria-hidden="true">Priva<em>tools</em></div>
    <div id="root">
      <div id="prepaint-shell" style="min-height:100vh;font-family:Manrope,system-ui,sans-serif">
        <header style="height:56px"></header>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Service worker registration lives in src/lib/sw-register.ts so it
         runs in production only and handles updates correctly (skipWaiting +
         controllerchange reload). Don't re-add an inline registration here. -->
    <!-- First-party analytics proxy — no Google scripts in the browser. Disabled for DNT/GPC/local opt-out. -->
    <script>
      (function(){
        var GA_ID = 'G-B3VWQ44MX1';
        var OPT_OUT_KEY = 'pt-analytics-opt-out';
        var CLIENT_ID_KEY = 'pt-analytics-client-id';
        var sent = false;
        function storageOptOut(){
          try { return window.localStorage.getItem(OPT_OUT_KEY) === '1'; }
          catch (e) { return false; }
        }
        function browserPrivacySignal(){
          var nav = window.navigator || {};
          var dnt = nav.doNotTrack || nav.msDoNotTrack || window.doNotTrack;
          return nav.globalPrivacyControl === true || dnt === '1' || dnt === 'yes';
        }
        function analyticsDisabled(){
          return browserPrivacySignal() || storageOptOut();
        }
        function setDisableFlag(disabled){
          window['ga-disable-' + GA_ID] = !!disabled;
        }
        function randomId(){
          var bytes = new Uint32Array(2);
          if (window.crypto && window.crypto.getRandomValues) {
            window.crypto.getRandomValues(bytes);
            return String(bytes[0]) + '.' + String(bytes[1]);
          }
          return String(Date.now()) + '.' + String(Math.floor(Math.random() * 1000000000));
        }
        function clientId(){
          try {
            var existing = window.localStorage.getItem(CLIENT_ID_KEY);
            if (existing) return existing;
            var next = randomId();
            window.localStorage.setItem(CLIENT_ID_KEY, next);
            return next;
          } catch (e) {
            return randomId();
          }
        }
        function sendPageview(){
          if (sent) return;
          if (analyticsDisabled()) {
            setDisableFlag(true);
            return;
          }
          setDisableFlag(false);
          sent = true;
          var body = JSON.stringify({
            path: window.location.pathname,
            title: document.title,
            referrer: document.referrer,
            client_id: clientId()
          });
          if (navigator.sendBeacon) {
            navigator.sendBeacon('/api/analytics/pageview', new Blob([body], { type: 'application/json' }));
            return;
          }
          fetch('/api/analytics/pageview', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: body,
            keepalive: true,
            credentials: 'same-origin'
          }).catch(function(){});
        }
        window.ptSetAnalyticsDisabled = function(disabled){
          var effectiveDisabled = !!disabled || browserPrivacySignal() || storageOptOut();
          setDisableFlag(effectiveDisabled);
          if (!effectiveDisabled) sendPageview();
        };
        window.addEventListener('storage', function(event){
          if (event.key === OPT_OUT_KEY) window.ptSetAnalyticsDisabled(storageOptOut());
        });
        setDisableFlag(analyticsDisabled());
        if ('requestIdleCallback' in window) {
          requestIdleCallback(sendPageview, { timeout: 4000 });
        } else {
          window.addEventListener('load', function(){ setTimeout(sendPageview, 1500); });
        }
      })();
    </script>
  </body>
